<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VanishChat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d14;
      color: #e2e2e2;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── AUTH SCREEN ─────────────────────────────────────────────────── */
    #authScreen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #1a0e2e 0%, #0d0d14 70%);
      overflow-y: auto;
      padding: 24px 12px;
    }

    .auth-card {
      background: #14141f;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 36px 32px;
      width: 420px;
      max-width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo .icon { font-size: 2.4rem; }
    .auth-logo h1 { font-size: 1.5rem; font-weight: 800; color: #fff; margin-top: 6px; }
    .auth-logo h1 span { color: #a78bfa; }
    .auth-logo p { font-size: 0.8rem; color: #555; margin-top: 4px; }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid #2a2a3a;
      margin-bottom: 24px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }

    .auth-tab.active { color: #a78bfa; border-bottom-color: #a78bfa; }

    .auth-form { display: flex; flex-direction: column; gap: 12px; }

    .auth-form input, .auth-form textarea {
      padding: 11px 14px;
      background: #0d0d14;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      color: #e2e2e2;
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .auth-form input:focus, .auth-form textarea:focus { border-color: #7c3aed; }

    .auth-form textarea {
      resize: none;
      min-height: 72px;
      line-height: 1.45;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #888;
      letter-spacing: 0.02em;
    }

    .field .hint {
      font-size: 0.7rem;
      color: #555;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .field-row { grid-template-columns: 1fr; }
    }

    .auth-btn {
      padding: 12px;
      background: #7c3aed;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }

    .auth-btn:hover { background: #6d28d9; }

    .auth-error {
      font-size: 0.82rem;
      color: #f87171;
      text-align: center;
      min-height: 18px;
    }

    /* ─── APP SCREEN ──────────────────────────────────────────────────── */
    #appScreen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    #appScreen.visible { display: flex; }

    /* topbar */
    .topbar {
      background: #14141f;
      border-bottom: 1px solid #2a2a3a;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .topbar-logo { font-size: 1rem; font-weight: 800; color: #fff; margin-right: auto; }
    .topbar-logo span { color: #a78bfa; }

    .topbar-user {
      font-size: 0.82rem;
      color: #a78bfa;
      font-weight: 700;
      background: #1e1830;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #3a2a5a;
    }

    .signout-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid #3a3a50;
      border-radius: 8px;
      color: #888;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .signout-btn:hover { border-color: #f87171; color: #f87171; }

    /* layout */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* sidebar */
    .sidebar {
      width: 260px;
      background: #10101a;
      border-right: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-head {
      padding: 14px 16px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .add-contact-btn {
      background: #7c3aed;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
    }

    .add-contact-btn:hover { background: #6d28d9; }

    .add-contact-form {
      display: none;
      padding: 0 12px 12px;
      gap: 8px;
      flex-direction: column;
    }

    .add-contact-form.visible { display: flex; }

    .add-contact-form input {
      padding: 8px 10px;
      background: #0d0d14;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #e2e2e2;
      font-size: 0.82rem;
      outline: none;
    }

    .add-contact-form input:focus { border-color: #7c3aed; }

    .add-contact-form .auth-btn {
      margin-top: 0;
      padding: 8px;
      font-size: 0.82rem;
    }

    .add-contact-error {
      font-size: 0.75rem;
      color: #f87171;
      min-height: 14px;
      text-align: center;
    }

    .contact-list { flex: 1; overflow-y: auto; }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.12s;
    }

    .contact-item:hover { background: #18182a; }
    .contact-item.active { background: #1e1830; border-left-color: #7c3aed; }

    .c-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #6d28d9);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; color: #fff; flex-shrink: 0;
    }

    .c-name { font-size: 0.9rem; font-weight: 500; color: #ddd; }

    .sidebar-empty {
      padding: 24px 16px;
      font-size: 0.82rem;
      color: #444;
      text-align: center;
    }

    /* chat area */
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* chat header */
    .chat-header {
      background: #14141f;
      border-bottom: 1px solid #2a2a3a;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 62px;
    }

    .chat-peer { font-size: 1rem; font-weight: 700; color: #fff; }
    .chat-subtitle { font-size: 0.73rem; color: #22c55e; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .timer-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0d0d14;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.8rem;
    }

    .timer-control label { color: #a78bfa; font-weight: 600; white-space: nowrap; }

    .timer-control select {
      background: transparent;
      border: none;
      color: #e2e2e2;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }

    .timer-control select option { background: #14141f; }

    /* messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
      gap: 10px;
      font-size: 0.88rem;
    }

    .chat-placeholder .big { font-size: 3rem; opacity: 0.25; }

    .msg-row {
      display: flex;
      gap: 8px;
      max-width: 68%;
      animation: msgIn 0.18s ease;
    }

    @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }

    .msg-av {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.75rem; color: #fff; flex-shrink: 0;
      background: linear-gradient(135deg, #a78bfa, #6d28d9);
      margin-top: 2px;
    }

    .msg-row.mine .msg-av { background: linear-gradient(135deg, #34d399, #059669); }

    .msg-body { display: flex; flex-direction: column; gap: 3px; }

    .msg-bubble {
      background: #1c1c2e;
      border: 1px solid #2a2a3a;
      border-radius: 14px;
      padding: 8px 13px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
      color: #e2e2e2;
    }

    .msg-row.mine .msg-bubble { background: #3b1f72; border-color: #6d28d9; }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 3px;
      font-size: 0.68rem;
    }

    .msg-row.mine .msg-meta { justify-content: flex-end; }

    .ttl {
      background: #0e2218;
      color: #6ee7b7;
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 600;
    }

    .ttl.warn  { background: #221a08; color: #fbbf24; }
    .ttl.hot   { background: #220a0a; color: #f87171; }

    /* compose */
    .compose {
      border-top: 1px solid #2a2a3a;
      padding: 12px 20px;
      background: #10101a;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .compose textarea {
      flex: 1;
      background: #0d0d14;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      color: #e2e2e2;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 10px 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.15s;
    }

    .compose textarea:focus { border-color: #7c3aed; }
    .compose textarea:disabled { opacity: 0.35; cursor: not-allowed; }

    .send-btn {
      padding: 0 22px;
      height: 44px;
      background: #7c3aed;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .send-btn:hover { background: #6d28d9; }
    .send-btn:disabled { background: #222238; color: #444; cursor: not-allowed; }

    .compose-hint {
      flex: 1;
      text-align: center;
      color: #333;
      font-size: 0.85rem;
      padding: 10px;
    }

    /* toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #14141f; border: 1px solid #2a2a3a;
      border-left: 3px solid #a78bfa;
      color: #e2e2e2; padding: 10px 16px;
      border-radius: 8px; font-size: 0.83rem;
      opacity: 0; transform: translateY(8px);
      transition: all 0.2s; pointer-events: none; z-index: 999;
    }

    .toast.show { opacity: 1; transform: none; }
    .toast.err  { border-left-color: #f87171; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
  </style>
</head>
<body>

<!-- ─── AUTH SCREEN ──────────────────────────────────────────────────── -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">💬</div>
      <h1>Vanish<span>Chat</span></h1>
      <p>Messages that disappear. Conversations that matter.</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</div>
      <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">Register</div>
    </div>

    <!-- Login form -->
    <div id="formLogin" class="auth-form">
      <div class="field">
        <label for="loginUser">Username</label>
        <input id="loginUser" type="text" placeholder="Your username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input id="loginPass" type="password" placeholder="Your password" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') doLogin()" />
      </div>
      <div class="auth-error" id="loginErr"></div>
      <button class="auth-btn" onclick="doLogin()">Sign In</button>
    </div>

    <!-- Register form -->
    <div id="formRegister" class="auth-form" style="display:none">
      <div class="field">
        <label for="regDisplay">Display name</label>
        <input id="regDisplay" type="text" placeholder="How others see you" autocomplete="name" />
      </div>
      <div class="field">
        <label for="regUser">Username</label>
        <input id="regUser" type="text" placeholder="Letters and numbers, 2–30 chars" autocomplete="username" />
        <span class="hint">This is how people add you as a contact.</span>
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="regBio">Short bio <span style="color:#555;font-weight:500">(optional)</span></label>
        <textarea id="regBio" maxlength="160" placeholder="A line about you…"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="regPass">Password</label>
          <input id="regPass" type="password" placeholder="Min 4 characters" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="regPass2">Confirm password</label>
          <input id="regPass2" type="password" placeholder="Repeat password" autocomplete="new-password"
                 onkeydown="if(event.key==='Enter') doRegister()" />
        </div>
      </div>
      <div class="auth-error" id="regErr"></div>
      <button class="auth-btn" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<!-- ─── APP SCREEN ───────────────────────────────────────────────────── -->
<div id="appScreen">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-logo">💬 Vanish<span>Chat</span></div>
    <div class="topbar-user" id="topbarUser"></div>
    <button class="signout-btn" onclick="signOut()">Sign Out</button>
  </div>

  <div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-head">
        Contacts
        <button class="add-contact-btn" onclick="toggleAddContact()">+ Add</button>
      </div>
      <div class="add-contact-form" id="addContactForm">
        <input id="addContactUser" type="text" placeholder="Username" autocomplete="off"
               onkeydown="if(event.key==='Enter') addContact()" />
        <button class="auth-btn" onclick="addContact()">Add contact</button>
        <div class="add-contact-error" id="addContactErr"></div>
      </div>
      <div class="contact-list" id="contactList">
        <div class="sidebar-empty">Loading contacts…</div>
      </div>
    </div>

    <!-- Chat area -->
    <div class="chat-area">

      <div class="chat-header" id="chatHeader">
        <div>
          <div class="chat-peer" id="chatPeer">Select a contact</div>
          <div class="chat-subtitle" id="chatSubtitle" style="display:none">
            <div class="live-dot"></div>
            Messages disappear after: <strong id="timerLabel">24 hours</strong>
          </div>
        </div>
        <div class="timer-control" id="timerControl" style="display:none">
          <label>⏱ Disappear after</label>
          <select id="timerSelect" onchange="onTimerChange()">
            <option value="86400" selected>24 hours</option>
            <option value="604800">7 days</option>
            <option value="2592000">30 days</option>
            <option value="7776000">90 days</option>
          </select>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="chat-placeholder">
          <div class="big">💬</div>
          <div>Pick a contact to start chatting</div>
        </div>
      </div>

      <div class="compose" id="compose">
        <div class="compose-hint">Select a contact to start chatting</div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_MSG  = '/api/messages';
  const API_USER = '/api/users';
  const API_CONTACT = '/api/contacts';

  // ── State ────────────────────────────────────────────────────────────────
  let me = null;          // logged-in username
  let peer = null;        // active chat peer
  let chatTTL = 86400;    // seconds — per-chat disappear time
  const cdTimers = {};    // countdown interval handles keyed by message id

  const TTL_LABELS = {
    86400:   '24 hours',
    604800:  '7 days',
    2592000: '30 days',
    7776000: '90 days'
  };

  // ── Auth: tab switch ──────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('formLogin').style.display    = tab === 'login'    ? 'flex' : 'none';
    document.getElementById('formRegister').style.display = tab === 'register' ? 'flex' : 'none';
    document.getElementById('loginErr').textContent = '';
    document.getElementById('regErr').textContent   = '';
  }

  // ── Auth: login ───────────────────────────────────────────────────────────
  async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    document.getElementById('loginErr').textContent = '';

    if (!username || !password) {
      document.getElementById('loginErr').textContent = 'Please fill in all fields.';
      return;
    }

    try {
      const res = await fetch(`${API_USER}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        enterApp(data.username);
      } else {
        document.getElementById('loginErr').textContent = data.message || 'Login failed.';
      }
    } catch (e) {
      document.getElementById('loginErr').textContent = 'Server error. Try again.';
    }
  }

  // ── Auth: register ────────────────────────────────────────────────────────
  async function doRegister() {
    const displayName = document.getElementById('regDisplay').value.trim();
    const username = document.getElementById('regUser').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const bio = document.getElementById('regBio').value.trim();
    const password = document.getElementById('regPass').value;
    const confirmPassword = document.getElementById('regPass2').value;
    document.getElementById('regErr').textContent = '';

    if (!displayName || !username || !email || !password || !confirmPassword) {
      document.getElementById('regErr').textContent = 'Please fill in all required fields.';
      return;
    }
    if (username.length < 2 || username.length > 30) {
      document.getElementById('regErr').textContent = 'Username must be 2–30 characters.';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('regErr').textContent = 'Enter a valid email address.';
      return;
    }
    if (password.length < 4) {
      document.getElementById('regErr').textContent = 'Password must be at least 4 characters.';
      return;
    }
    if (password !== confirmPassword) {
      document.getElementById('regErr').textContent = 'Passwords do not match.';
      return;
    }

    try {
      const res = await fetch(`${API_USER}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ displayName, username, email, bio, password, confirmPassword })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        toast('Account created! You can now sign in.');
        switchTab('login');
        document.getElementById('loginUser').value = username;
        document.getElementById('regDisplay').value = '';
        document.getElementById('regUser').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regBio').value = '';
        document.getElementById('regPass').value = '';
        document.getElementById('regPass2').value = '';
      } else {
        document.getElementById('regErr').textContent = data.message || 'Registration failed.';
      }
    } catch (e) {
      document.getElementById('regErr').textContent = 'Server error. Try again.';
    }
  }

  // ── Enter app ─────────────────────────────────────────────────────────────
  function enterApp(username) {
    me = username;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('visible');
    document.getElementById('topbarUser').textContent = '👤 ' + me;
    loadContacts();
    startPolling();
  }

  // ── Sign out ──────────────────────────────────────────────────────────────
  function signOut() {
    me = null; peer = null;
    clearAllTimers();
    document.getElementById('appScreen').classList.remove('visible');
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginErr').textContent = '';
    document.getElementById('messages').innerHTML = '<div class="chat-placeholder"><div class="big">💬</div><div>Pick a contact to start chatting</div></div>';
    document.getElementById('compose').innerHTML = '<div class="compose-hint">Select a contact to start chatting</div>';
    document.getElementById('chatSubtitle').style.display = 'none';
    document.getElementById('timerControl').style.display = 'none';
    document.getElementById('chatPeer').textContent = 'Select a contact';
    document.getElementById('addContactForm').classList.remove('visible');
    document.getElementById('addContactUser').value = '';
    document.getElementById('addContactErr').textContent = '';
  }

  function toggleAddContact() {
    const form = document.getElementById('addContactForm');
    form.classList.toggle('visible');
    document.getElementById('addContactErr').textContent = '';
    if (form.classList.contains('visible')) {
      document.getElementById('addContactUser').focus();
    }
  }

  async function addContact() {
    const username = document.getElementById('addContactUser').value.trim();
    const err = document.getElementById('addContactErr');
    err.textContent = '';
    if (!username) {
      err.textContent = 'Enter a username.';
      return;
    }
    try {
      const res = await fetch(API_CONTACT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ owner: me, contactUsername: username })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        document.getElementById('addContactUser').value = '';
        document.getElementById('addContactForm').classList.remove('visible');
        toast('Added ' + data.username);
        await loadContacts();
        openChat(data.username);
      } else {
        err.textContent = data.message || 'Could not add contact.';
      }
    } catch (e) {
      err.textContent = 'Server error. Try again.';
    }
  }

  // ── Load contacts from server ─────────────────────────────────────────────
  async function loadContacts() {
    try {
      const res = await fetch(`${API_CONTACT}/${encodeURIComponent(me)}`);
      if (!res.ok) return;
      const users = await res.json();
      renderContacts(users);
    } catch (e) {
      console.error('Failed to load contacts', e);
    }
  }

  function renderContacts(users) {
    const list = document.getElementById('contactList');
    if (!users.length) {
      list.innerHTML = '<div class="sidebar-empty">No contacts yet.<br>Use + Add to find someone by username.</div>';
      return;
    }
    list.innerHTML = '';
    users.forEach(u => {
      const div = document.createElement('div');
      div.className = 'contact-item' + (peer === u ? ' active' : '');
      div.onclick = () => openChat(u);
      div.innerHTML = `
        <div class="c-avatar">${u[0].toUpperCase()}</div>
        <div class="c-name">${esc(u)}</div>
      `;
      list.appendChild(div);
    });
  }

  // ── Open chat ─────────────────────────────────────────────────────────────
  function openChat(contact) {
    peer = contact;
    chatTTL = parseInt(document.getElementById('timerSelect').value, 10);

    document.getElementById('chatPeer').textContent = contact;
    document.getElementById('chatSubtitle').style.display = 'flex';
    document.getElementById('timerControl').style.display = 'flex';
    document.getElementById('timerLabel').textContent = TTL_LABELS[chatTTL];

    loadContacts();   // refresh active highlight
    loadMessages();
    renderCompose();
  }

  // ── Timer changed ─────────────────────────────────────────────────────────
  function onTimerChange() {
    chatTTL = parseInt(document.getElementById('timerSelect').value, 10);
    document.getElementById('timerLabel').textContent = TTL_LABELS[chatTTL];
    toast('Messages in this chat will disappear after ' + TTL_LABELS[chatTTL]);
    const ta = document.getElementById('msgInput');
    if (ta) ta.placeholder = `Message ${peer}…`;
  }

  // ── Compose ───────────────────────────────────────────────────────────────
  function renderCompose() {
    const area = document.getElementById('compose');
    if (!me || !peer) {
      area.innerHTML = '<div class="compose-hint">Select a contact to start chatting</div>';
      return;
    }
    area.innerHTML = `
      <textarea id="msgInput" placeholder="Message ${esc(peer)}…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
      <button class="send-btn" onclick="sendMsg()">Send</button>
    `;
    document.getElementById('msgInput').focus();
  }

  // ── Send message ──────────────────────────────────────────────────────────
  async function sendMsg() {
    const ta = document.getElementById('msgInput');
    if (!ta) return;
    const text = ta.value.trim();
    if (!text) return;

    ta.disabled = true;
    try {
      const res = await fetch(API_MSG, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: me, recipient: peer, content: text, ttlSeconds: chatTTL })
      });
      if (!res.ok) throw new Error(await res.text());
      ta.value = '';
      loadMessages();
    } catch (e) {
      toast('Failed to send: ' + e.message, true);
    } finally {
      ta.disabled = false;
      ta.focus();
    }
  }

  // ── Load conversation ─────────────────────────────────────────────────────
  async function loadMessages() {
    if (!me || !peer) return;
    try {
      const res = await fetch(`${API_MSG}/conversation/${encodeURIComponent(me)}/${encodeURIComponent(peer)}`);
      if (!res.ok) return;
      const msgs = await res.json();
      renderMessages(msgs);
    } catch (e) {
      console.error('loadMessages error', e);
    }
  }

  // ── Render messages ───────────────────────────────────────────────────────
  function renderMessages(msgs) {
    const box = document.getElementById('messages');
    const atBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 60;

    clearAllTimers();

    if (!msgs.length) {
      box.innerHTML = '<div class="chat-placeholder"><div class="big">✉️</div><div>No messages yet — say hello!</div></div>';
      return;
    }

    box.innerHTML = '';
    msgs.forEach(m => {
      const mine = m.sender === me;
      const row = document.createElement('div');
      row.className = 'msg-row' + (mine ? ' mine' : '');
      row.id = 'row-' + m.id;
      row.innerHTML = `
        <div class="msg-av">${m.sender[0].toUpperCase()}</div>
        <div class="msg-body">
          <div class="msg-bubble">${esc(m.content)}</div>
          <div class="msg-meta">
            <span class="ttl" id="ttl-${m.id}">…</span>
          </div>
        </div>
      `;
      box.appendChild(row);
      startCountdown(m.id, m.expiresAt);
    });

    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  // ── Countdown ─────────────────────────────────────────────────────────────
  function startCountdown(id, expiresAt) {
    const exp = new Date(expiresAt).getTime();
    function tick() {
      const secs = Math.max(0, Math.floor((exp - Date.now()) / 1000));
      const el  = document.getElementById('ttl-' + id);
      const row = document.getElementById('row-' + id);
      if (!el) { clearInterval(cdTimers[id]); return; }

      el.textContent = '⏱ ' + fmtTTL(secs);
      el.className = 'ttl' + (secs < 3600 ? ' hot' : secs < 86400 ? ' warn' : '');

      if (secs <= 0) {
        clearInterval(cdTimers[id]);
        if (row) {
          row.style.transition = 'opacity 0.6s';
          row.style.opacity = '0';
          setTimeout(() => row.remove(), 600);
        }
      }
    }
    tick();
    cdTimers[id] = setInterval(tick, 1000);
  }

  function clearAllTimers() {
    Object.values(cdTimers).forEach(clearInterval);
    Object.keys(cdTimers).forEach(k => delete cdTimers[k]);
  }

  // ── Polling ───────────────────────────────────────────────────────────────
  function startPolling() {
    setInterval(() => {
      if (peer) loadMessages();
    }, 3000);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmtTTL(s) {
    if (s < 60)    return s + 's';
    if (s < 3600)  return Math.floor(s/60) + 'm ' + (s%60) + 's';
    if (s < 86400) return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm';
    return Math.floor(s/86400) + 'd ' + Math.floor((s%86400)/3600) + 'h';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  let toastTm;
  function toast(msg, err = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastTm);
    toastTm = setTimeout(() => el.className = 'toast', 3200);
  }
</script>
</body>
